name: tests

# CI de GitHub DESHABILITADA a nivel de cuenta (los runs dan "No jobs were run").
# El gate REAL es el hook local `scripts/pre-push` (corre la suite en el server
# antes de cada push) + la puerta de staging del cron (`regen_publicar.sh`).
# Este workflow queda solo como manual (workflow_dispatch) hasta que se habilite
# Actions/billing en la cuenta.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2 (pin SHA)
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.3.0 (pin SHA)
        with:
          python-version: "3.12"

      - name: Dependencias (fijadas)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sintaxis
        run: python -m compileall -q ingest gen scripts tests

      # --- Fixtures REALES: la CI genera la web (web_tmp) y valida el contrato ---
      # Con la DB sintética determinista (tests/crea_fixture.py) la CI ejecuta de
      # verdad los checks que antes se omitían por no haber artefactos en git:
      # CSV↔HTML (§8-9), tarjetas↔latest.json (§10) y comparador regional (§11).
      - name: Fixture vivienda.db (determinista)
        run: python tests/crea_fixture.py

      - name: Generar web_ci (staging, sin tocar web/)
        run: python gen/gen_vivienda.py --out web_ci

      - name: Contrato de datos (completo, sobre web_ci)
        run: python tests/test_datos.py --web-dir web_ci

      - name: Watchdog del RDL (clasificación de la resolución del Congreso)
        run: python tests/test_watchdog_rdl.py

      - name: Salud de la tabla territorial canónica
        run: python tests/test_territorios.py

      - name: Lint (errores duros: undefined/compile) + audit, sin romper por estilo
        run: |
          pip install ruff pip-audit
          ruff check --select E9,F63,F7,F82 --no-cache ingest gen scripts tests
          pip-audit --progress-spinner off