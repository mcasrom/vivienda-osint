name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias (fijadas)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sintaxis
        run: python -m compileall -q ingest gen scripts tests

      - name: Contrato de datos (modo CI: los artefactos web/ y la DB no están en git y se omiten con aviso)
        run: python tests/test_datos.py

      - name: Watchdog del RDL (clasificación de la resolución del Congreso)
        run: python tests/test_watchdog_rdl.py

      - name: Salud de la tabla territorial canónica
        run: python tests/test_territorios.py